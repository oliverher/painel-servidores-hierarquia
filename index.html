<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Servidores por Unidade e Hierarquia</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: barra lateral escura (marca, menu, órgãos) + área principal em papel com barra superior fixa. Paleta do Modelo Cores. */
:root{
  --ink:#14282A; --ink-2:#1D3336; --ink-3:#284245;
  --paper:#EFE9DC; --paper-soft:#F8F5EC; --paper-dark:#E2DAC5;
  --seal:#B3862F; --seal-light:#D6AE5C; --trust:#2F6B63; --trust-light:#5C9089; --alert:#9B4A3D;
  --ink-soft:#4B5450;
  --line:rgba(20,40,42,.14); --line-ink:rgba(239,233,220,.16);
  --f-serif:'Source Serif 4',Georgia,serif;
  --f-sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-sans);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-family:var(--f-serif);font-weight:700;letter-spacing:-.01em;text-wrap:balance}
button{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:296px minmax(0,1fr);min-height:100vh}

/* ---------- barra lateral ---------- */
.side{background:var(--ink);color:var(--paper-soft);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;min-height:0}
.side-in{padding-block:26px 0;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:12px;display:flex;flex-direction:column;min-height:0;flex:1}
.brand .org{font-size:12.5px;font-weight:600;color:var(--seal-light);letter-spacing:.02em}
.brand h1{font-size:23px;line-height:1.15;color:var(--paper-soft);margin-top:6px}
.brand .per{font-size:12.5px;color:rgba(239,233,220,.55);margin-top:8px}
.nav{display:flex;flex-direction:column;gap:2px;margin:22px 0 0;padding-right:8px}
.nav button{display:flex;align-items:center;justify-content:space-between;gap:10px;background:none;border:0;border-left:3px solid transparent;padding:10px 12px;text-align:left;cursor:pointer;font-size:14px;font-weight:500;color:rgba(239,233,220,.78);border-radius:0 2px 2px 0}
.nav button:hover{background:var(--ink-2);color:var(--paper-soft)}
.nav button[aria-current="page"]{background:var(--ink-3);color:var(--paper-soft);border-left-color:var(--seal-light)}
.nav .bd{font-size:11.5px;font-weight:600;color:var(--seal-light)}
.sec-label{font-size:12px;font-weight:600;color:var(--seal-light);margin:26px 0 8px;padding-right:8px;display:flex;justify-content:space-between}
.side input{width:calc(100% - 8px);font:inherit;font-size:13px;padding:8px 10px;background:var(--ink-2);border:1px solid var(--line-ink);border-radius:2px;color:var(--paper-soft);margin-bottom:8px}
.side input::placeholder{color:rgba(239,233,220,.45)}
.olist{overflow:auto;flex:1;min-height:0;padding-right:8px;margin-right:0;scrollbar-width:thin;scrollbar-color:var(--ink-3) transparent}
.olist button{display:flex;justify-content:space-between;gap:10px;width:100%;background:none;border:0;border-left:3px solid transparent;padding:8px 10px;text-align:left;cursor:pointer;font-size:12.5px;line-height:1.3;color:rgba(239,233,220,.72);border-radius:0 2px 2px 0}
.olist button:hover{background:var(--ink-2);color:var(--paper-soft)}
.olist button[aria-current="true"]{background:var(--ink-3);color:var(--paper-soft);border-left-color:var(--seal-light)}
.olist .t{min-width:0;overflow-wrap:anywhere}
.olist .n{font-variant-numeric:tabular-nums;font-weight:600;color:var(--seal-light);white-space:nowrap}
.side-foot{padding:14px 12px 16px max(20px,env(safe-area-inset-left,0px));font-size:11.5px;color:rgba(239,233,220,.45);border-top:1px solid var(--line-ink)}

/* ---------- principal ---------- */
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:5;background:var(--paper-soft);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;padding-block:12px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
.topl{display:flex;align-items:center;gap:14px;min-width:0;flex-wrap:wrap}
.back{background:var(--ink);color:var(--paper-soft);border:0;border-radius:2px;padding:7px 14px;font-size:13px;font-weight:600;cursor:pointer}
.back:hover{background:var(--ink-3)}
.clr{background:none;border:1px solid var(--ink);border-radius:2px;padding:8px 12px;font-size:13px;font-weight:500;cursor:pointer}
.clr:hover{background:var(--paper-dark)}
.crumb{font-size:13px;color:var(--ink-soft)}
.crumb b{color:var(--ink);font-weight:600}
.seg{display:flex;border:1px solid var(--ink);border-radius:2px;overflow:hidden}
.seg button{background:transparent;border:0;padding:7px 14px;font-size:13px;font-weight:500;cursor:pointer;color:var(--ink)}
.seg button+button{border-left:1px solid var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper-soft)}
.content{padding-block:34px 56px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));max-width:1120px;width:100%;display:flex;flex-direction:column;gap:26px}
.kicker{font-size:13px;font-weight:600;color:var(--seal);margin-bottom:8px}
.h1{font-size:clamp(26px,3.4vw,38px);line-height:1.14;overflow-wrap:anywhere}
.lead{font-size:16px;color:var(--ink-soft);max-width:640px;margin-top:10px;line-height:1.6}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.kpi{background:var(--paper-soft);border:1px solid var(--line);border-radius:2px;padding:16px 18px;min-width:0}
.kpi .k{font-size:12px;font-weight:600;color:var(--ink-soft)}
.kpi .v{font-family:var(--f-serif);font-size:32px;font-weight:700;line-height:1.1;margin-top:6px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12.5px;color:var(--ink-soft);margin-top:4px;overflow-wrap:anywhere}

.panel{background:var(--paper-soft);border:1px solid var(--line);border-radius:2px;min-width:0}
.ph{padding:18px 20px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.ph h2{font-size:19px}
.ph .hint{font-size:13px;color:var(--ink-soft)}
.cols{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:26px;align-items:start}

.row{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(60px,1fr) 70px;gap:16px;align-items:center;padding:9px 20px;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.row:last-child{border-bottom:0}
button.row{cursor:pointer}
button.row:hover{background:var(--paper)}
.row .nm{font-size:13.5px;overflow-wrap:anywhere}
.row .og{display:block;font-size:11.5px;color:var(--ink-soft);margin-top:1px}
.row .c{font-variant-numeric:tabular-nums;font-weight:600;text-align:right;font-size:14px}
.row .c small{display:block;font-weight:400;font-size:11px;color:var(--ink-soft)}
.bar{height:10px;background:var(--paper-dark);border-radius:1px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--trust)}
.bar.gold i{background:var(--seal)}
.ctl{display:flex;gap:12px;flex-wrap:wrap;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line)}
.ctl input{flex:1 1 240px;min-width:0;font:inherit;padding:9px 12px;border:1px solid var(--ink);border-radius:2px;background:#fff;color:var(--ink)}
.more{padding:14px 20px;text-align:center}
.btn{background:var(--ink);color:var(--paper-soft);border:0;border-radius:2px;padding:9px 16px;font-size:13px;font-weight:600;cursor:pointer}
.btn:hover{background:var(--ink-3)}
.link{background:none;border:0;padding:0;color:var(--trust);font-weight:600;font-size:13px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.empty{padding:30px 20px;color:var(--ink-soft);text-align:center}
.note{font-size:14px;line-height:1.6;color:var(--ink-soft)}
.note p+p{margin-top:12px}
.note b{color:var(--ink)}
.quote{font-family:var(--f-serif);font-style:italic;font-size:17px;border-left:3px solid var(--seal);padding-left:16px;max-width:620px;color:var(--ink)}
:focus-visible{outline:2px solid var(--seal);outline-offset:2px}
.side :focus-visible{outline-color:var(--seal-light)}

.filters{display:flex;flex-direction:column;gap:0}
.frow{display:flex;gap:14px;align-items:flex-start;padding:14px 20px;border-bottom:1px solid var(--line)}
.flab{flex:none;width:118px;font-size:12px;font-weight:600;color:var(--ink-soft);padding-top:7px}
.chips{display:flex;flex-wrap:wrap;gap:8px;min-width:0;flex:1}
.chip{background:transparent;border:1px solid var(--ink);border-radius:20px;padding:6px 13px;font-size:13px;font-weight:500;cursor:pointer;display:inline-flex;gap:7px;align-items:center}
.chip:hover{background:var(--paper-dark)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper-soft)}
.chip b{font-weight:600;font-size:11.5px;color:var(--seal)}
.chip[aria-pressed="true"] b{color:var(--seal-light)}
.chip.sm{padding:4px 10px;font-size:12px}
.ochips{max-height:104px;overflow:auto;padding:2px}
.slide{display:flex;align-items:center;gap:14px;flex:1;min-width:0;flex-wrap:wrap}
.slide input[type=range]{flex:1 1 200px;min-width:0;accent-color:var(--seal)}
.slide output{font-variant-numeric:tabular-nums;font-weight:600;min-width:150px;font-size:13.5px}
.tog{display:inline-flex;align-items:center;gap:9px;font-size:13.5px;cursor:pointer;padding-top:5px}
.tog input{accent-color:var(--seal);width:17px;height:17px}
.active{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:11px 20px;background:var(--paper-dark);border-bottom:1px solid var(--line);font-size:13px}
.ghead{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:baseline;padding:11px 20px;background:var(--ink);color:var(--paper-soft)}
.ghead h3{font-size:15px;font-family:var(--f-serif);overflow-wrap:anywhere}
.ghead span{font-size:12.5px;color:var(--seal-light);font-weight:600}
@media (max-width:900px){
  .frow{flex-direction:column;gap:8px;padding:12px 16px}
  .flab{width:auto;padding-top:0}
  .ghead{padding-left:16px;padding-right:16px;grid-template-columns:minmax(0,1fr)}

  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:static;height:auto}
  .side-in{padding-bottom:12px;padding-right:max(16px,env(safe-area-inset-right,0px))}
  .nav{flex-direction:row;flex-wrap:wrap;margin-top:16px}
  .nav button{border-left:0;border-bottom:3px solid transparent;padding:8px 12px}
  .nav button[aria-current="page"]{border-bottom-color:var(--seal-light)}
  .olist{max-height:210px;flex:none}
  .side-foot{display:none}
  .top{position:static;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .content{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .cols{grid-template-columns:minmax(0,1fr)}
  .row{grid-template-columns:minmax(0,1fr) 64px;gap:6px 12px;padding:10px 16px}
  .row .bar{grid-column:1 / -1;grid-row:2}
  .ph,.ctl{padding-left:16px;padding-right:16px}
}

/* ---------- hierarquia ---------- */
.tree{padding:6px 0 10px}
.hhead{display:grid;grid-template-columns:minmax(0,1fr) 120px 92px 118px;gap:14px;padding:8px 20px;font-size:11.5px;font-weight:600;color:var(--ink-soft);border-bottom:1px solid var(--line);background:var(--paper-soft)}
.hhead span:nth-child(n+3){text-align:right}
.hr{display:grid;grid-template-columns:minmax(0,1fr) 120px 92px 118px;gap:14px;align-items:center;padding:5px 20px;border-bottom:1px solid rgba(20,40,42,.07)}
.hr:hover{background:var(--paper)}
.hl{display:flex;align-items:center;gap:6px;min-width:0;flex-wrap:wrap}
.tg{flex:none;width:22px;height:22px;border:1px solid var(--line);background:var(--paper);border-radius:2px;cursor:pointer;font-size:13px;line-height:1;color:var(--ink);padding:0}
.tg:hover{background:var(--paper-dark)}
.tg.sp{visibility:hidden;display:inline-block}
.hn{font-weight:700;overflow-wrap:anywhere;line-height:1.25}
.hn.t0{font-size:22px;font-family:var(--f-serif)}.hn.t1{font-size:19px;font-family:var(--f-serif)}.hn.t2{font-size:17px}.hn.t3{font-size:15.5px}.hn.t4{font-size:14.5px}.hn.t5{font-size:13.5px}.hn.t6{font-size:13px}
.tag{font-weight:500;font-size:11px;color:var(--ink-soft);border:1px solid var(--line);border-radius:10px;padding:1px 7px;white-space:nowrap}
.tag.nd{color:var(--alert);border-color:var(--alert)}
.iso{background:none;border:0;color:var(--trust);font-size:12px;font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px;padding:0 2px;white-space:nowrap}
.hb{height:8px;background:var(--paper-dark);border-radius:1px;overflow:hidden}
.hb i{display:block;height:100%;background:var(--trust)}
.hc{font-variant-numeric:tabular-nums;text-align:right;font-weight:700;font-size:14.5px}
.hc.z{color:var(--ink-soft);font-weight:400}
.hc.sub{font-weight:600;color:var(--trust)}
.hr.t0 .hc{font-size:17px}.hr.t1 .hc{font-size:16px}
.hr.g0{background:var(--ink);color:var(--paper-soft)}
.hr.g0 .tg{background:var(--ink-3);border-color:var(--line-ink);color:var(--paper-soft)}
.hr.g0 .hc.sub,.hr.g0 .hc{color:var(--seal-light)}
.hr.g0 .hb{background:var(--ink-3)}.hr.g0 .hb i{background:var(--seal-light)}
.hr.g0:hover{background:var(--ink-2)}
mark{background:#f3de9c;color:inherit;padding:0 1px;border-radius:2px}
.hbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line)}
.hbar input[type=search]{flex:1 1 240px;min-width:0;font:inherit;padding:9px 12px;border:1px solid var(--ink);border-radius:2px;background:#fff;color:var(--ink)}
.clr2{background:none;border:1px solid var(--ink);border-radius:2px;padding:8px 12px;font-size:13px;font-weight:500;cursor:pointer}
.clr2:hover{background:var(--paper-dark)}
@media (max-width:900px){
  .hhead{display:none}
  .hr{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:4px 12px;padding:8px 14px}
  .hr .hb{display:none}
  .hr .hl{grid-column:1 / -1}
  .hr .hc.own::before{content:"Na unidade ";font-weight:400;font-size:11px;color:var(--ink-soft)}
  .hr .hc.sub::before{content:"Com subordinadas ";font-weight:400;font-size:11px;color:var(--ink-soft)}
  .hr .hc{text-align:left}
  .hr .hc:empty{display:none}
  .hbar{padding:12px 14px}
}
</style>
</head>
<body>

<div class="app">
  <aside class="side" aria-label="Menu">
    <div class="side-in">
      <div class="brand">
        <p class="org">Governo de Goiás</p>
        <h1>Servidores por unidade</h1>
        <p class="per">Folha de setembro de 2026</p>
      </div>
      <nav class="nav" id="nav" aria-label="Seções"></nav>
      <div class="sec-label"><span>Órgãos</span><span id="ocount"></span></div>
      <input type="search" id="oq" placeholder="Filtrar órgão" aria-label="Filtrar órgão">
      <div class="olist" id="olist"></div>
    </div>
    <div class="side-foot">Sem nomes de servidores e sem valores.</div>
  </aside>

  <div class="main">
    <div class="top">
      <div class="topl"><button class="back" id="back" hidden>← Voltar</button><div class="crumb" id="crumb"></div></div>
      <div class="seg" role="group" aria-label="Contagem">
        <button id="m-s" aria-pressed="true" title="Cada pessoa conta uma vez">Pessoas</button>
        <button id="m-l" aria-pressed="false" title="Cada linha da folha conta uma vez">Vínculos</button>
      </div>
    </div>
    <main class="content" id="view"></main>
  </div>
</div>

function geral(){

  const hist = edges.map(e => ({l:e[2], n:U.filter(u => cnt(u) >= e[0] && cnt(u) <= e[1]).length}));

      </section>

        ${big.map(u => `<div class="row" style="grid-template-columns:minmax(0,1fr) minmax(30px,.5fr) 60px"><div class="nm">${esc(u.u)}<span class="og">${esc(u.o)}</span></div><div class="bar"><i style="width:${cnt(u)/bm*100}%"></i></div><div class="c">${fmt(cnt(u))}</div></div>`).join('')}

function listView(all){
  const base0 = all ? (st.orgs.length ? U.filter(u => st.orgs.includes(u.o)) : U) : unitsByOrg[st.org];
  const bySearch = base0.filter(x => !st.q || norm(x.u).includes(norm(st.q)) || (all && norm(x.o).includes(norm(st.q))));
  const maxc = Math.max(1, ...bySearch.map(cnt));
  const minV = st.minp ? Math.max(1, Math.round(maxc * Math.pow(st.minp/100, 3))) : 0;
  const inBand = x => st.band < 0 || (cnt(x) >= BANDS[st.band][0] && cnt(x) <= BANDS[st.band][1]);
  const list = bySearch.filter(x => inBand(x) && cnt(x) >= minV);
  const osum = {}; list.forEach(x => osum[x.o] = (osum[x.o]||0) + cnt(x));
  const onum = {}; list.forEach(x => onum[x.o] = (onum[x.o]||0) + 1);
  const inner = (a,b) => st.order==='a' ? a.u.localeCompare(b.u,'pt') : st.order==='m' ? cnt(a)-cnt(b) || a.u.localeCompare(b.u,'pt') : cnt(b)-cnt(a) || a.u.localeCompare(b.u,'pt');
  if(st.group) list.sort((a,b) => osum[b.o]-osum[a.o] || a.o.localeCompare(b.o,'pt') || inner(a,b));
  else list.sort((a,b) => inner(a,b) || a.o.localeCompare(b.o,'pt'));
  const filtered = !!(st.q || st.band >= 0 || minV || (all && st.orgs.length));
  const sum = list.reduce((s,x) => s + cnt(x), 0);
  const max = Math.max(1, ...list.map(cnt));
  const top = list.length ? [...list].sort((a,b) => cnt(b)-cnt(a))[0] : null;
  const total = filtered ? sum : (all ? grandTotal() : cnt(OM[st.org]));
  const head = all
    ? `<p class="kicker">Lista completa</p><h1 class="h1">${st.orgs.length ? 'Unidades de ' + st.orgs.length + (st.orgs.length===1?' órgão':' órgãos') : 'Todas as unidades'}</h1><p class="lead">Marque um ou mais órgãos para ver as unidades de cada um. Combine com faixa de tamanho, busca e quantidade mínima.</p>`
    : `<p class="kicker">Órgão</p><h1 class="h1">${esc(st.org)}</h1><p style="margin-top:10px"><button class="link" data-o="${encodeURIComponent(st.org)}">Ver na hierarquia</button></p>`;
  const bandChips = BANDS.map((b,i) => `<button class="chip" data-band="${i}" aria-pressed="${st.band===i}">${b[2]} <b>${fmt(bySearch.filter(x => cnt(x)>=b[0] && cnt(x)<=b[1] && cnt(x)>=minV).length)}</b></button>`).join('');
  const orgChips = all ? `<div class="frow"><div class="flab">Órgãos</div><div class="chips ochips">${[...D.O].sort((a,b)=>cnt(b)-cnt(a)).map(o => `<button class="chip sm" data-og="${encodeURIComponent(o.o)}" aria-pressed="${st.orgs.includes(o.o)}">${esc(o.o)} <b>${fmt(unitsByOrg[o.o].length)}</b></button>`).join('')}</div></div>` : '';
  const active = [];
  if(all && st.orgs.length) active.push(st.orgs.length + (st.orgs.length===1?' órgão':' órgãos'));
  if(st.band >= 0) active.push('faixa ' + BANDS[st.band][2]);
  if(minV) active.push('mínimo ' + fmt(minV));
  if(st.q) active.push('busca “' + esc(st.q) + '”');
  const shown = list.slice(0, st.limit);
  let rows = '', lastO = null;
  shown.forEach(x => {
    if(st.group && x.o !== lastO){
      lastO = x.o;
      rows += `<div class="ghead"><h3>${esc(x.o)}</h3><span>${fmt(onum[x.o])} unidades · ${fmt(osum[x.o])} ${word()}</span></div>`;
    }
    rows += `<div class="row"><div class="nm">${esc(x.u)}${all&&!st.group?`<span class="og">${esc(x.o)}</span>`:''}</div><div class="bar${st.group?' gold':''}"><i style="width:${cnt(x)/max*100}%"></i></div><div class="c">${fmt(cnt(x))}<small>${pct(cnt(x), st.group ? osum[x.o] : (total||1))}</small></div></div>`;
  });
  return `<div>${head}</div>
  ${kpis([[filtered?'Servidores nas unidades listadas':(all?(st.mode==='s'?'Servidores':'Vínculos'):'Servidores no órgão'), fmt(total), filtered?'Soma das unidades que passaram nos filtros':(st.mode==='s'?'Pessoas únicas':'Linhas da folha')], ['Unidades', fmt(list.length), filtered?'de ' + fmt(base0.length) + ' no recorte':''], ['Média por unidade', list.length?fmt(sum/list.length):'0', list.length?'Mediana: ' + fmt([...list].map(cnt).sort((a,b)=>a-b)[Math.floor(list.length/2)]):''], ['Maior unidade', top?fmt(cnt(top)):'0', top?esc(top.u):'']])}
  <section class="panel">
    <div class="filters">
      <div class="ctl">
        <input type="search" id="q" placeholder="Buscar unidade${all?' ou órgão':''}" value="${esc(st.q)}" aria-label="Buscar unidade">
        <div class="seg" role="group" aria-label="Ordem"><button data-ord="n" aria-pressed="${st.order==='n'}">Maior primeiro</button><button data-ord="m" aria-pressed="${st.order==='m'}">Menor primeiro</button><button data-ord="a" aria-pressed="${st.order==='a'}">A–Z</button></div>
      </div>
      ${orgChips}
      <div class="frow"><div class="flab">Tamanho da unidade</div><div class="chips">${bandChips}</div></div>
      <div class="frow"><div class="flab">Mínimo de ${word()}</div><div class="slide"><input type="range" id="min" min="0" max="100" value="${st.minp}" aria-label="Quantidade mínima"><output>${minV ? fmt(minV) + ' ou mais' : 'Sem mínimo'}</output></div></div>
      ${all ? `<div class="frow"><div class="flab">Exibição</div><label class="tog"><input type="checkbox" id="grp" ${st.group?'checked':''}> Agrupar unidades por órgão</label></div>` : ''}
      ${active.length ? `<div class="active"><span>Filtros ativos: <b>${active.join(' · ')}</b></span><button class="clr" id="clrall">Limpar filtros</button></div>` : ''}
    </div>
    <div class="ph" style="border-bottom:1px solid var(--line)"><span class="hint">${fmt(list.length)} unidades · ${fmt(sum)} ${word()} somando as unidades</span><span class="hint">Quantidade · % ${st.group?'do órgão':'do recorte'}</span></div>
    ${rows || '<div class="empty">Nenhuma unidade com esses filtros. Tente afrouxar a faixa ou o mínimo.</div>'}
    ${list.length > st.limit ? `<div class="more"><button class="btn" id="more">Mostrar mais ${fmt(Math.min(100, list.length-st.limit))} de ${fmt(list.length-st.limit)}</button></div>` : ''}
  </section>`;
}


/* ---------- hierarquia ---------- */
let NID = 0; const NODES = [];
function mkNode(a, parent, depth){
  const n = {id:NID++, n:a[0], so:a[1], st:a[2], lo:a[3], lt:a[4], src:a[5], dn:a[6], parent, depth, kids:[], norm:norm(a[0])};
  NODES.push(n); n.kids = a[7].map(k => mkNode(k, n, depth+1)); return n;
}
const ROOT = mkNode(H, null, 0);
const ORG_BY_DN = {}; NODES.forEach(n => { if(n.dn) ORG_BY_DN[n.dn] = n; });
const hown = n => st.mode === 's' ? n.so : n.lo;
const htot = n => st.mode === 's' ? n.st : n.lt;
const hscope = () => st.horg && ORG_BY_DN[st.horg] ? ORG_BY_DN[st.horg] : ROOT;
function ensureOpen(){
  const key = st.horg || '';
  if(st.openKey === key) return; st.openKey = key; st.open = new Set();
  const sc = hscope(); st.open.add(sc.id);
  if(sc === ROOT) ROOT.kids.forEach(g => st.open.add(g.id));
}
function hvisible(sc){
  const q = norm(st.hq || ''); const vis = new Set();
  const walk = n => {
    if(st.hide0 && htot(n) === 0) return false;
    let kid = false; n.kids.forEach(k => { if(walk(k)) kid = true; });
    if(!q || n.norm.includes(q) || kid){ vis.add(n.id); return true; }
    return false;
  };
  walk(sc); return vis;
}
function hl(name){
  const q = (st.hq || '').trim(); if(!q) return esc(name);
  const nn = norm(name), qq = norm(q); const i = nn.indexOf(qq);
  if(i < 0 || nn.length !== name.length) return esc(name);
  return esc(name.slice(0,i)) + '<mark>' + esc(name.slice(i, i+q.length)) + '</mark>' + esc(name.slice(i+q.length));
}
function hrow(n, d, sc, baseTot){
  const own = hown(n), tot = htot(n), has = n.kids.length > 0;
  const open = st.hq ? true : st.open.has(n.id);
  const lvl = Math.min(d, 6);
  const num = v => v ? fmt(v) : '—';
  const isG = n.src === 'g' || n.src === 'r', isO = n.src === 'o' || n.src === 'n';
  const tags = (n.src==='n' ? '<span class="tag nd">sem dados na planilha</span>' : '') + (n.src==='l' ? '<span class="tag">lotação</span>' : '');
  const iso = isO && sc === ROOT && n.dn ? `<button class="iso" data-hiso="${encodeURIComponent(n.dn)}">abrir só este órgão</button>` : '';
  const exp = isO ? `<button class="iso" data-hexp="${n.id}">exportar HTML</button>` : '';
  const ownCell = (isG || isO) ? '' : num(own);
  const subCell = (has || isG) ? num(tot) : '';
  return `<div class="hr t${lvl}${isG?' g0':''}"><div class="hl" style="padding-left:${d*22}px">${has?`<button class="tg" data-t="${n.id}" aria-expanded="${open}" aria-label="${open?'Recolher':'Expandir'} ${esc(n.n)}">${open?'−':'+'}</button>`:'<span class="tg sp"></span>'}<span class="hn t${lvl}">${hl(n.n)}</span>${tags}${iso}${exp}</div>
    <div class="hb"><i style="width:${baseTot?Math.max(tot?1:0,tot/baseTot*100):0}%"></i></div>
    <div class="hc own${own?'':' z'}">${ownCell}</div>
    <div class="hc sub${tot?'':' z'}">${subCell}</div></div>`;
}
function hrows(n, d, sc, vis, baseTot, out){
  if(!vis.has(n.id)) return;
  out.push(hrow(n, d, sc, baseTot));
  if(!(st.hq ? true : st.open.has(n.id))) return;
  let kids = n.kids;
  if(st.hsort === 'n') kids = [...kids].sort((a,b) => htot(b)-htot(a) || a.id-b.id);
  kids.forEach(k => hrows(k, d+1, sc, vis, baseTot, out));
}
function htree(){
  const sc = hscope(); ensureOpen();
  const vis = hvisible(sc); const out = [];
  hrows(sc, 0, sc, vis, htot(sc), out);
  if(!out.length) return '<div class="empty">Nenhuma unidade encontrada com esse nome.</div>';
  return `<div class="hhead"><span>Unidade</span><span>Participação no total</span><span>Na unidade</span><span>Com subordinadas</span></div><div class="tree">${out.join('')}</div>`;
}
function hcsv(){
  const sc = hscope(); const rows = [['Nível','Caminho','Unidade','Na unidade','Com subordinadas']];
  const walk = (n, path) => { const p = [...path, n.n]; rows.push([p.length-1, p.join(' > '), n.n, hown(n), htot(n)]); n.kids.forEach(k => walk(k, p)); };
  walk(sc, []);
  const csv = '﻿' + rows.map(r => r.map(v => '"' + String(v).replace(/"/g,'""') + '"').join(';')).join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv;charset=utf-8'}));
  a.download = 'servidores_hierarquia_' + (st.horg ? norm(st.horg).replace(/\s+/g,'_').slice(0,40) : 'estado') + '.csv'; a.click(); URL.revokeObjectURL(a.href);
}

function hier(){
  const sc = hscope(); ensureOpen();
  const orgs = NODES.filter(n => n.src==='o' || n.src==='n'), withData = orgs.filter(n => n.src==='o');
  let units = 0, withP = 0; const walk = n => { if(n.src==='d'){ units++; if(hown(n)>0) withP++; } n.kids.forEach(walk); };
  walk(sc);
  const lab = st.mode==='s' ? 'Servidores (pessoas)' : 'Vínculos';
  const kp = sc === ROOT
    ? [['Órgãos e entidades', fmt(orgs.length), fmt(withData.length) + ' com servidores na planilha'], [lab, fmt(htot(sc)), 'Soma de todo o estado'], ['Unidades do decreto', fmt(units), fmt(withP) + ' com servidores lotados']]
    : [[lab + ' no órgão', fmt(htot(sc)), 'Soma de toda a hierarquia'], ['Unidades do decreto', fmt(units), fmt(withP) + ' com servidores lotados']];
  return `<div><p class="kicker">Hierarquia</p><h1 class="h1">${sc===ROOT ? 'Servidores por unidade, órgão por órgão' : esc(sc.n)}</h1>
  <p class="lead">Cada unidade aparece dentro da unidade a que está subordinada no Decreto 10.218, Anexo I. O número da direita soma a unidade com tudo o que está abaixo dela.${sc!==ROOT ? ' <button class="link" data-hall0="1">Ver todo o estado</button> · <button class="link" data-lista="' + encodeURIComponent(st.horg) + '">Ver como lista plana</button>' : ''}</p></div>
  ${kpis(kp)}
  <section class="panel">
    <div class="hbar">
      <input type="search" id="hq" placeholder="Buscar unidade na hierarquia" value="${esc(st.hq)}" aria-label="Buscar unidade na hierarquia">
      <button class="clr2" data-hall="1">Expandir tudo</button><button class="clr2" data-hnone="1">Recolher tudo</button>
      <div class="seg" role="group" aria-label="Ordem"><button data-hsort="d" aria-pressed="${st.hsort==='d'}">Ordem do decreto</button><button data-hsort="n" aria-pressed="${st.hsort==='n'}">Maior primeiro</button></div>
      <label class="tog" style="padding-top:0"><input type="checkbox" id="hhide" ${st.hide0?'checked':''}> Ocultar sem servidores</label>
      <button class="clr2" id="hcsv">Baixar CSV</button><button class="clr2" id="hhtml">Exportar HTML</button>
    </div>
    <div id="htree">${htree()}</div>
  </section>`;
}
function hrefresh(){ const t = $('htree'); if(t) t.innerHTML = htree(); }

function sobre(){
  return `<div><p class="kicker">Sobre os dados</p><h1 class="h1">Como as quantidades foram contadas</h1></div>
  <section class="panel"><div class="ph"><h2>Origem e critérios</h2></div><div class="note" style="padding:20px">
    <p><b>Fonte:</b> planilha de remuneração de setembro de 2026, com ${fmt(D.tot[1])} linhas, 26 órgãos e ${fmt(U.length)} combinações de órgão e unidade. Aposentados, pensionistas, jetons e reformados já estavam fora da planilha.</p>
    <p><b>Pessoas:</b> cada servidor conta uma vez, identificado pelo CPF mascarado mais o nome. Total de ${fmt(D.tot[0])} pessoas.</p>
    <p><b>Vínculos:</b> cada linha da folha conta uma vez. Quem tem dois cargos, como professor efetivo e temporário, aparece duas vezes. Total de ${fmt(D.tot[1])} vínculos.</p>
    <p><b>Totais do órgão e geral:</b> quem atua em mais de uma unidade ou órgão entra uma vez só, por isso o total pode ser menor que a soma das unidades.</p>
    <p><b>Unidade não informada:</b> o nome "UNIDADE NAO INFORMADA" vem da própria planilha e aparece em vários órgãos. Vale conferir na origem.</p>
    <p><b>Hierarquia:</b> a estrutura vem do Anexo I do Decreto 10.218, sem as linhas em vermelho (extintas). Cada unidade da folha foi ligada à unidade de mesmo nome do órgão. Quando o nome não consta do decreto, ela entra abaixo do departamento da folha correspondente (por exemplo, os postos Vapt Vupt abaixo da Gerência de Operação do Atendimento ao Cidadão). Lotações que não têm correspondência no decreto, as inativas e as de unidade não informada ficam fora da hierarquia, por isso os totais da aba Hierarquia são menores que os da Visão geral. Órgãos do decreto sem linhas na planilha aparecem como "sem dados na planilha".</p>
    <p><b>Na unidade e com subordinadas:</b> "Na unidade" conta quem está lotado naquela unidade. "Com subordinadas" soma a unidade e tudo o que está abaixo dela, contando cada pessoa uma vez.</p>

    <p><b>Privacidade:</b> o painel não traz nomes de servidores nem valores de remuneração.</p>
  </div></section>`;
}

function back(){ const p = hist.pop(); if(!p) return; Object.assign(st, p); st.limit = 100; render(); window.scrollTo({top:0}); }
function render(keepFocus){
  $('back').hidden = !hist.length;
  nav(); olist(); crumb();
  $('m-s').setAttribute('aria-pressed', st.mode==='s'); $('m-l').setAttribute('aria-pressed', st.mode==='l');
  $('view').innerHTML = st.view==='geral' ? geral() : st.view==='hier' ? hier() : st.view==='sobre' ? sobre() : listView(st.view==='todas');
  if(keepFocus){ const q = $('q'); if(q){ q.focus(); q.setSelectionRange(q.value.length,q.value.length); } }
}
function go(v, o){ if(v !== st.view || (o && o !== st.org) || st.q || v==='hier') hist.push(snap()); st.view = v; st.band = -1; st.minp = 0; if(v==='hier'){ st.horg = o || null; st.hq = ''; } else if(o) st.org = o; st.q = ''; st.limit = 100; render(); window.scrollTo({top:0}); }

document.addEventListener('click', e => {
  if(e.target.id === 'back'){ back(); return; }
  if(e.target.id === 'clr'){ st.q = ''; st.limit = 100; render(true); return; }
  if(e.target.id === 'clrall'){ st.q = ''; st.band = -1; st.minp = 0; st.orgs = []; st.limit = 100; render(); return; }
  const b = e.target.closest('[data-band]'); if(b){ const i = +b.dataset.band; st.band = st.band === i ? -1 : i; st.limit = 100; render(); return; }
  const g = e.target.closest('[data-og]'); if(g){ const o = decodeURIComponent(g.dataset.og); st.orgs = st.orgs.includes(o) ? st.orgs.filter(x => x !== o) : [...st.orgs, o]; st.limit = 100; render(); return; }
  const n = e.target.closest('[data-v]'); if(n){ go(n.dataset.v); return; }
  const tg = e.target.closest('[data-t]'); if(tg){ const id = +tg.dataset.t; st.open.has(id) ? st.open.delete(id) : st.open.add(id); const y = window.scrollY; hrefresh(); window.scrollTo({top:y}); return; }
  const hi = e.target.closest('[data-hiso]'); if(hi){ go('hier', decodeURIComponent(hi.dataset.hiso)); return; }
  if(e.target.closest('[data-hall0]')){ go('hier'); return; }
  const li = e.target.closest('[data-lista]'); if(li){ go('orgao', decodeURIComponent(li.dataset.lista)); return; }
  if(e.target.closest('[data-hall]')){ NODES.forEach(n => n.kids.length && st.open.add(n.id)); hrefresh(); return; }
  if(e.target.closest('[data-hnone]')){ st.open = new Set([hscope().id]); st.hq = ''; render(); return; }
  const hs = e.target.closest('[data-hsort]'); if(hs){ st.hsort = hs.dataset.hsort; render(); return; }
  if(e.target.id === 'hcsv'){ hcsv(); return; }
  if(e.target.id === 'hhtml'){ hexport(hscope()); return; }
  const he = e.target.closest('[data-hexp]'); if(he){ hexport(NODES[+he.dataset.hexp]); return; }
  const o = e.target.closest('[data-o]'); if(o){ go('hier', decodeURIComponent(o.dataset.o)); return; }

  const r = e.target.closest('[data-ord]'); if(r){ st.order = r.dataset.ord; st.limit = 100; render(); return; }
  if(e.target.id === 'more'){ st.limit += 100; render(); }
});
document.addEventListener('change', e => { if(e.target.id === 'min'){ st.minp = +e.target.value; st.limit = 100; render(); const m = $('min'); if(m) m.focus(); }
if(e.target.id === 'hhide'){ st.hide0 = e.target.checked; hrefresh(); return; }
if(e.target.id === 'grp'){ st.group = e.target.checked; st.limit = 100; render(); } });
document.addEventListener('input', e => {
  if(e.target.id === 'q'){ st.q = e.target.value.trim(); st.limit = 100; render(true); }
  if(e.target.id === 'hq'){ st.hq = e.target.value.trim(); hrefresh(); return; }
  if(e.target.id === 'min'){ const o = e.target.parentNode.querySelector('output'); if(o) o.textContent = 'Solte para aplicar (' + e.target.value + '%)'; }
  if(e.target.id === 'oq'){ st.oq = e.target.value.trim(); olist(); }
});
$('m-s').onclick = () => { st.mode = 's'; render(); };
$('m-l').onclick = () => { st.mode = 'l'; render(); };
render();
</script>
</body></html>
